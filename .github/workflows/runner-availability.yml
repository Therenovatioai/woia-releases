name: Release runner availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native runner (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Identify native platform
        run: node -e "if(process.platform!=='win32'||process.arch!=='x64')process.exit(1);console.log(JSON.stringify({os:process.platform,architecture:process.arch}))"
