name: Release runner availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native runner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - name: Identify native platform
        run: node -e "console.log(JSON.stringify({os:process.platform,architecture:process.arch}))"