name: Publication verification
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed Foundation SHA
        required: true
        type: string
      workflow_commit:
        description: Exact reviewed public workflow SHA; select this main ref
        required: true
        type: string
      release_version:
        description: Prerelease version to prepare, without publication
        required: true
        default: 0.1.0-alpha.1
        type: string
      bridge_version:
        description: Exact retained starter origin
        required: true
        default: '0.1.6'
        type: choice
        options: ['0.1.4', '0.1.6']
permissions:
  contents: read
  actions: read
concurrency:
  group: publication-${{ inputs.commit }}
  cancel-in-progress: false
env:
  WOIA_COMMIT: ${{ inputs.commit }}
  WOIA_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
  WOIA_RELEASE_VERSION: ${{ inputs.release_version }}
  WOIA_BRIDGE_VERSION: ${{ inputs.bridge_version }}
jobs:
  static:
    name: Publication static checks
    if: github.repository == 'Therenovatioai/woia-releases' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WOIA_JOB: static
    steps:
      - name: Checkout reviewed public verification adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.workflow_commit }}
          persist-credentials: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify public adapter integrity
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Guard both identities before granting access
        run: node verification/driver.mjs guard
      - name: Capture exact private checkout and remove its temporary authentication
        env:
          WOIA_SOURCE_READ_KEY: ${{ secrets.WOIA_SOURCE_READ_KEY }}
        run: node verification/driver.mjs checkout
      - name: Check public transport adapter
        run: node --test verification/evidence.test.mjs
      - name: Run private static checks
        run: node verification/driver.mjs run
      - name: Verify public adapter integrity
        id: seal_guard
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Encrypt private evidence for the maintainer
        id: seal
        if: always() && steps.seal_guard.outcome == 'success'
        run: node verification/driver.mjs seal
      - name: Preserve only encrypted evidence
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.run_attempt }}-${{ env.WOIA_JOB }}
          path: ${{ runner.temp }}/woia-sealed/${{ env.WOIA_JOB }}.wci
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  platform:
    name: Publication platform (${{ matrix.os }})
    needs: static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    env:
      WOIA_JOB: platform-${{ matrix.platform }}
    steps:
      - name: Checkout reviewed public verification adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.workflow_commit }}
          persist-credentials: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify public adapter integrity
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Guard both identities before granting access
        run: node verification/driver.mjs guard
      - name: Capture exact private checkout and remove its temporary authentication
        env:
          WOIA_SOURCE_READ_KEY: ${{ secrets.WOIA_SOURCE_READ_KEY }}
        run: node verification/driver.mjs checkout
      - name: Run native conformance, packaging, runtime smoke and functional suite
        run: node verification/driver.mjs run
      - name: Verify public adapter integrity
        id: seal_guard
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Encrypt private evidence for the maintainer
        id: seal
        if: always() && steps.seal_guard.outcome == 'success'
        run: node verification/driver.mjs seal
      - name: Preserve only encrypted evidence
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.run_attempt }}-${{ env.WOIA_JOB }}
          path: ${{ runner.temp }}/woia-sealed/${{ env.WOIA_JOB }}.wci
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  windows:
    name: Publication Windows (${{ matrix.partition }}/8)
    needs: static
    runs-on: windows-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      WOIA_JOB: windows-${{ matrix.partition }}
    steps:
      - name: Checkout reviewed public verification adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.workflow_commit }}
          persist-credentials: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify public adapter integrity
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Guard both identities before granting access
        run: node verification/driver.mjs guard
      - name: Capture exact private checkout and remove its temporary authentication
        env:
          WOIA_SOURCE_READ_KEY: ${{ secrets.WOIA_SOURCE_READ_KEY }}
        run: node verification/driver.mjs checkout
      - name: Run complete Windows partition
        run: node verification/driver.mjs run
      - name: Verify public adapter integrity
        id: seal_guard
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Encrypt private evidence for the maintainer
        id: seal
        if: always() && steps.seal_guard.outcome == 'success'
        run: node verification/driver.mjs seal
      - name: Preserve only encrypted evidence
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.run_attempt }}-${{ env.WOIA_JOB }}
          path: ${{ runner.temp }}/woia-sealed/${{ env.WOIA_JOB }}.wci
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  verified:
    name: Publication verified (exact source and workflow)
    needs: [static, platform, windows]
    if: always() && github.repository == 'Therenovatioai/woia-releases' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WOIA_JOB: verified
      WOIA_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Checkout reviewed public verification adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.workflow_commit }}
          persist-credentials: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify public adapter integrity
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Guard both identities before granting access
        run: node verification/driver.mjs guard
      - name: Capture exact private checkout and remove its temporary authentication
        env:
          WOIA_SOURCE_READ_KEY: ${{ secrets.WOIA_SOURCE_READ_KEY }}
        run: node verification/driver.mjs checkout
      - name: Download authenticated encrypted evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: evidence-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/woia-sealed-input
          merge-multiple: true
      - name: Decrypt evidence only in the aggregation job
        env:
          WOIA_EVIDENCE_PRIVATE_KEY: ${{ secrets.WOIA_EVIDENCE_PRIVATE_KEY }}
        run: node verification/driver.mjs unseal
      - name: Verify complete matrices and original publication receipts
        run: node verification/driver.mjs run
      - name: Verify public adapter integrity
        id: seal_guard
        if: always()
        run: >-
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"6ddd548a3b38fcd49db0323767471b8cccc15072c28f8e45b591601905a64ecb","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"052cc1d843694c625b1a4550be7c6428991781d5ac665bbf0523d46991be1367","verification/evidence.test.mjs":"b1725d088c8f5281d08dad4252bd8aaf87225cc8b19e0efc28d97d1924e2721a","verification/preflight.mjs":"fe094301b01543d0991c683083c8f4d6cadd88272c342dddf6bfbd434025f59f"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Encrypt private evidence for the maintainer
        id: seal
        if: always() && steps.seal_guard.outcome == 'success'
        run: node verification/driver.mjs seal
      - name: Preserve only encrypted evidence
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.run_attempt }}-${{ env.WOIA_JOB }}
          path: ${{ runner.temp }}/woia-sealed/${{ env.WOIA_JOB }}.wci
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
