name: Confidential focused diagnostic
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed Foundation SHA
        required: true
        type: string
      workflow_commit:
        description: Exact reviewed public workflow SHA; select this main ref
        required: true
        type: string
      release_version:
        description: Prerelease version to prepare, without publication
        required: true
        default: 0.1.0-alpha.1
        type: string
      bridge_version:
        description: Exact retained starter origin
        required: true
        default: 0.1.6
        type: choice
        options:
          - 0.1.6
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-${{ inputs.commit }}
  cancel-in-progress: false
env:
  WOIA_COMMIT: ${{ inputs.commit }}
  WOIA_WORKFLOW_COMMIT: ${{ inputs.workflow_commit }}
  WOIA_RELEASE_VERSION: ${{ inputs.release_version }}
  WOIA_BRIDGE_VERSION: ${{ inputs.bridge_version }}
jobs:
  diagnostic:
    name: Focused diagnostic (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      WOIA_JOB: platform-win32
    steps:
      - name: Checkout reviewed public verification adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.workflow_commit }}
          persist-credentials: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify public adapter integrity
        if: always()
        run: node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"91749f1b463e11f176681bc59d4d7645c03187215af8f0b0136e74a487225309","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"12869f2ae1e62550186cd73ff672c5dac618deca2334ecc8fed42b488f60f9b8","verification/evidence.test.mjs":"85833ceda10d3e00ec54af40bdd037dce942720adf078b81e576efd620e57dac","verification/preflight.mjs":"9cf973bc7afc0a9830720b5c8a81613e451d3cd5bcba27a4e323732a87ab2c66"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Guard both identities before granting access
        run: node verification/driver.mjs guard
      - name: Capture exact private checkout and remove its temporary authentication
        env:
          WOIA_SOURCE_READ_KEY: ${{ secrets.WOIA_SOURCE_READ_KEY }}
        run: node verification/driver.mjs checkout
      - name: Capture focused diagnostic only
        run: node verification/driver.mjs diagnose
      - name: Verify public adapter integrity
        id: seal_guard
        if: always()
        run: node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const pins={"verification/driver.mjs":"91749f1b463e11f176681bc59d4d7645c03187215af8f0b0136e74a487225309","verification/evidence-public.pem":"374d206b9d02731282645404cfd96d9a4efd34fd918498b3a320abb831d6818f","verification/evidence.mjs":"12869f2ae1e62550186cd73ff672c5dac618deca2334ecc8fed42b488f60f9b8","verification/evidence.test.mjs":"85833ceda10d3e00ec54af40bdd037dce942720adf078b81e576efd620e57dac","verification/preflight.mjs":"9cf973bc7afc0a9830720b5c8a81613e451d3cd5bcba27a4e323732a87ab2c66"};for(const [p,h] of Object.entries(pins)){if(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==h)throw Error("Adapter integrity rejected");}'
      - name: Encrypt private evidence for the maintainer
        id: seal
        if: always() && steps.seal_guard.outcome == 'success'
        run: node verification/driver.mjs seal
      - name: Preserve only encrypted evidence
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.run_attempt }}-${{ env.WOIA_JOB }}
          path: ${{ runner.temp }}/woia-sealed/${{ env.WOIA_JOB }}.wci
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
    if: github.repository == 'Therenovatioai/woia-releases' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
